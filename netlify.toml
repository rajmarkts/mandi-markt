[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"
  NEXT_TELEMETRY_DISABLED = "1"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[context.production.environment]
  NEXT_PUBLIC_POCKETBASE_URL = "https://mandi-pocketbase.fly.dev"

[context.deploy-preview.environment]
  NEXT_PUBLIC_POCKETBASE_URL = "https://mandi-pocketbase.fly.dev"
